services:

  db:
    image: postgres:16-alpine
    container_name: last-mile-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: last_mile_delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d last_mile_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: last-mile-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/last_mile_delivery
      SECRET_KEY: ${SECRET_KEY:-development-secret-key}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: last-mile-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: